name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to publish the APK on the "apk" branch

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK after its version
        id: apk
        run: |
          V=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Budget-$V.apk"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Budget-${{ steps.apk.outputs.version }}
          path: out/*.apk

      # The newest APK only, on its own branch, so it can be fetched with plain git.
      - name: Publish to the apk branch
        working-directory: out
        run: |
          git init -q
          git checkout -q -b apk
          echo "Built from ${GITHUB_SHA} on $(date -u +%Y-%m-%dT%H:%MZ)" > BUILD.txt
          git add .
          git -c user.name="build" -c user.email="build@users.noreply.github.com" commit -qm "APK ${{ steps.apk.outputs.version }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
